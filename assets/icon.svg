<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!--
    The mark is the product: a source letter, the divider this extension draws
    between original and translation, and the translated line beneath it.
    The two rules differ in length, weight, and hue so the stack still reads as
    three distinct elements at 16px, where fine detail collapses.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <circle cx="64" cy="64" r="62" fill="url(#bg)"/>
  <circle cx="64" cy="64" r="59" fill="none" stroke="url(#ring)" stroke-width="5"/>

  <!-- source letter -->
  <g fill="none" stroke="#f8fafc" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M45 63 L64 24 L83 63"/>
    <path d="M53 47 H75"/>
  </g>

  <!-- the divider -->
  <path d="M52 81 H76" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/>

  <!-- the translation -->
  <path d="M41 100 H87" fill="none" stroke="#c084fc" stroke-width="11" stroke-linecap="round"/>
</svg>
